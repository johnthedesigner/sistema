- id: quality.color.first-order-reflex
  statement: The primary color is not the category default (for example, medium blue around 220 to 240 degrees for a SaaS tool) unless the direction justifies it in writing.
  reason: Category defaults make every product look the same. They survive review because nobody chose them on purpose.
  layer: sistema-default
  severity: advisory
  applies_to: the primary seed
  sources: [guide.quality.visual-quality-signals#first-order-reflexes-category-obvious-choices]

- id: quality.color.bans
  statement: >-
    No opacity-derived container colors. Primary and secondary have distinct hues.
    The page (the `surface` role) is not pure black or pure white; raised panels may be white on an off-white
    page. The neutral ramp carries hue temperature.
  reason: Each of these is a reflex that weakens the system and is hard to notice later.
  layer: sistema-default
  severity: advisory
  applies_to: color tokens
  sources: [guide.quality.visual-quality-signals#color-token-bans]

- id: quality.color.commitment-level
  statement: Surface and neutral chroma match how much color the direction chose (quiet, brand, or tinted).
  reason: How much color is the product's decision. Tokens that drift from it contradict the approved direction.
  layer: sistema-default
  severity: advisory
  applies_to: surface, surface-raised, surface-overlay, border, and the neutral ramp
  sources: [guide.color.architecture#how-much-color]

- id: quality.review.compare-visually
  statement: >-
    When a play asks the person to choose between options that change how the system looks, or proposes
    changes to existing values, it first writes a self-contained page in sistema-review/ showing the
    current state next to each option, with differences marked, and asks the person to open it.
  reason: The consequences of design system choices are hard to judge from text alone.
  layer: sistema-default
  severity: advisory
  applies_to: sistema-review/<play-id>.html

- id: quality.review.outline
  statement: >-
    Every review page starts with the workflow outline as a strip: each step and approval with its
    status, and the current step highlighted.
  reason: The person should always see where this review sits in the whole process.
  layer: sistema-default
  severity: advisory
  applies_to: sistema-review/*.html

- id: quality.shape.bans
  statement: No uniform radius across all components, and no colored side-stripe accent borders on cards or alerts as the main way to signal status.
  reason: Both are reflexive defaults that make a system look generated. Status needs a glyph and text, not only a colored edge.
  layer: sistema-default
  severity: advisory
  applies_to: tokens/src/shape.json, components
  sources: [guide.quality.visual-quality-signals#token-bans]

- id: quality.craft.borders-have-a-job
  statement: >-
    Every border and divider has a function you can name: it marks where to click or type, helps the eye
    follow rows of data, or separates where space and tone can't. Panels, cards, chips, tooltips, and menus
    separate by tone, space, or shadow unless DECISIONS.md says otherwise.
  reason: Outlines on everything turn a screen into a grid of boxes, and the things that matter stop standing out.
  layer: sistema-default
  severity: advisory
  applies_to: tokens/src/shape.json, components, and review pages
  sources: [guide.visual-language.overview#the-craft-baseline, guide.quality.visual-quality-signals#plain-looking-traps]

- id: quality.craft.accent-for-meaning
  statement: >-
    The accent appears on the primary action, selection, focus, links, and the brand emphasis surfaces, and
    as far beyond them as the direction's answer on how much color allows. Other colors in the chrome carry meaning, such as status.
  reason: Color spent on decoration stops signaling what can be acted on, and competes with status.
  layer: sistema-default
  severity: advisory
  applies_to: color roles and components
  sources: [guide.visual-language.overview#how-much-color]

- id: quality.craft.text-tones
  statement: Text uses three or four tones from the neutral ramp (primary, secondary, tertiary, disabled), and none is pure black.
  reason: Tones carry hierarchy without extra size, weight, or lines.
  layer: sistema-default
  severity: advisory
  applies_to: the text color roles
  sources: [guide.visual-language.overview#the-craft-baseline]

- id: quality.craft.nested-radius
  statement: A shape nested inside another uses the outer radius minus the padding between them, and never a larger radius than its container.
  reason: Inner corners that don't follow the outer corner look misaligned.
  layer: sistema-default
  severity: advisory
  applies_to: components
  sources: [guide.shape.architecture#component-consistency]

- id: quality.craft.elevation-by-role
  statement: >-
    Shadows go on floating layers (menus, popovers, dialogs, toasts) and the featured surface, and on panels only
    when the direction separates panels by shadow. All shadows share one light source, and dark themes also raise
    surfaces by tone.
  reason: A shadow on everything stops meaning anything and adds noise.
  layer: sistema-default
  severity: advisory
  applies_to: tokens/src/shape.json and components
  sources: [guide.depth.architecture#emphasis-and-separation]

- id: quality.craft.type-weights
  statement: Labels and emphasis use a medium weight rather than bold, and numbers in tables and metrics use tabular figures.
  reason: Bold everywhere looks heavy and flattens hierarchy; proportional figures misalign columns.
  layer: sistema-default
  severity: advisory
  applies_to: type tokens and components
  sources: [guide.visual-language.overview#the-craft-baseline]

- id: quality.craft.rhythm
  statement: Spacing values come from the spacing scale on its base grid, and each density has one control height shared by buttons, fields, and selects.
  reason: Rhythm and alignment are felt more than seen; mismatched control heights make a row look broken.
  layer: sistema-default
  severity: advisory
  applies_to: tokens/src/spacing.json and components
  sources: [guide.spacing.layout#space-before-lines]

- id: quality.craft.quiet-states
  statement: Hover is a small tone change, pressed a little more, focus a ring in the focus color with an offset, and selected a neutral step stronger than hover, with the accent only as a detail (a checked box, an edge), so selection never outshouts status.
  reason: Loud states make a busy screen busier; consistent quiet states read as one system.
  layer: sistema-default
  severity: advisory
  applies_to: components
  sources: [guide.visual-language.overview#the-craft-baseline]

- id: quality.craft.status-as-detail
  statement: >-
    Inline messages, banners, and alerts sit on a neutral surface and carry their status color in the icon and
    the title. Tinted status fills are used for small marks (chips, badges), not for blocks of content.
  reason: >-
    Large status fills turn every notice into an alarm, and in a dark theme the container stops become deep,
    saturated blocks that outweigh the content.
  layer: sistema-default
  severity: advisory
  applies_to: components
  sources: [guide.visual-language.overview#the-craft-baseline]

- id: quality.craft.both-themes
  statement: >-
    Each visual treatment is one decision for every theme: what is neutral, what carries color, and how strong a
    selection, message, or emphasis is. Dark values translate the decision; a treatment that works in only one
    theme is changed, not patched in the other. Components are reviewed in light and dark side by side.
  reason: >-
    The same stop distance reads differently on a dark page, so a choice tuned in light can turn loud in dark.
    Treating dark as a translation of one decision keeps the system consistent and catches those cases.
  layer: sistema-default
  severity: advisory
  applies_to: components, color roles, and review pages
  sources: [guide.visual-language.overview#the-craft-baseline]

- id: quality.craft.one-icon-set
  statement: Components use one icon set, with its stroke weight matched to the adjacent text, unless DECISIONS.md names a second set and its use.
  reason: Mixed sets have different grids and weights, and look unfinished.
  layer: sistema-default
  severity: advisory
  applies_to: components
  sources: [guide.visual-language.overview#the-craft-baseline]

- id: quality.craft.motion
  statement: >-
    Transitions are short and eased out, on state changes and floating layers only. Surfaces opened many times
    a day from the keyboard, such as a command menu, open without entrance motion.
  reason: Motion that explains helps; motion for its own sake makes a product feel slow.
  layer: sistema-default
  severity: advisory
  applies_to: motion tokens and components
  sources: [guide.visual-language.overview#the-craft-baseline]

- id: quality.craft.emphasis-scarce
  statement: >-
    Strong emphasis (the featured surface, brand and inverse blocks) is applied by the role of the content, as the
    DESIGN.md records for each kind of screen, and kept rarer than ordinary panels and zones, so it still stands out. Ordinary panels and zones
    (page, zones, panels) differ by small steps.
  reason: If every level differs by the same amount, or everything is featured, nothing leads.
  layer: sistema-default
  severity: advisory
  applies_to: review pages, page examples, and components
  sources: [guide.visual-language.overview#emphasis]
