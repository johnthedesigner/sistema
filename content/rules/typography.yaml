- id: typography.line-height.by-role
  statement: >-
    Line heights are unitless and set per role, not once for the whole system. Each role's value is
    chosen for its typeface, size, and measure, and the evidence states the value and the reason.
  reason: >-
    The right line height shrinks as size grows, so one global value is wrong somewhere. Unitless values
    scale with the font size they're inherited by; fixed values don't.
  layer: sistema-default
  severity: blocking
  measure: { kind: presence }
  applies_to: tokens/src/typography.json
  checked_by: [play.typography.scale evidence]
  sources: [guide.typography.architecture#line-height]

- id: typography.roles.distinct
  statement: Type roles differ from their neighbors in weight, size, or letter spacing, not size alone, and each role has a stated purpose.
  reason: Size-only hierarchies read as generic and collapse in dense interfaces where sizes are close together.
  layer: sistema-default
  severity: advisory
  applies_to: tokens/src/typography.json
  sources: [guide.quality.visual-quality-signals#2-the-ai-slop-test]

- id: typography.fonts.self-hosted
  statement: Typefaces are served by the project (font files in the repo, or downloaded at build time), with only the weights the roles use.
  reason: Fetching fonts from a third party at runtime or in fragile build steps adds failures and privacy cost. Unused weights add load time.
  layer: sistema-default
  severity: advisory
  applies_to: the app's font loading

- id: typography.line-height.body
  statement: Paragraph text has at least the line height the project's standard requires, where it sets one.
  reason: Tight lines make it hard to track from one line to the next, especially for people with low vision or cognitive disabilities.
  layer: standard
  severity: blocking
  measure: { kind: min, unit: unitless }
  parameters:
    wcag-2.2: { AAA: 1.5 }
    wcag-2.1: { AAA: 1.5 }
  applies_to: body and long-form text roles in tokens/src/typography.json
  applies_when: The project's standard sets a minimum (WCAG 1.4.8, AAA). Otherwise this rule doesn't apply, and typography.line-height.by-role covers the choice.
  checked_by: [tool.type_scale, play.typography.scale evidence]
  sources: [guide.accessibility.floor#7-text-readability]

- id: typography.text-spacing
  statement: >-
    Text keeps working when people change its spacing. Nothing is clipped, hidden, or overlapping when a
    user sets line height to 1.5 times the font size, paragraph spacing to 2 times, letter spacing to
    0.12 times, and word spacing to 0.16 times.
  reason: People with low vision or dyslexia often widen text spacing to read. Fixed heights and clipped containers break when they do.
  layer: standard
  severity: blocking
  measure: { kind: presence }
  applies_to: components and pages with text
  applies_when: The project's standard includes WCAG 1.4.12 (WCAG 2.1 or 2.2, level AA and above).
  checked_by: [play.accessibility.audit evidence]
  sources: [guide.accessibility.floor#7-text-readability]
