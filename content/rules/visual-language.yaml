- id: visual-language.style-tile.sections
  statement: >-
    sistema-review/style-preview.html contains all seven sections: direction summary, the choices (each taste
    question shown as options rendered on the product's content), the composition, color, type, the emphasis
    map, and reviewer notes.
  reason: The person approving the direction needs to see every decision, as it would look, before values are generated from it.
  layer: sistema-default
  severity: blocking
  measure: { kind: presence }
  applies_to: sistema-review/style-preview.html
  checked_by: [gate.direction-approved]
  sources: [guide.visual-language.style-tile-format#2-required-sections]

- id: visual-language.style-tile.self-contained
  statement: >-
    The style preview is one file. The only external resources allowed are one stylesheet link to Google
    Fonts or a font CDN for the chosen typefaces, and the specimen tool's renderings. If a typeface can't be
    loaded that way, the page says which font is shown instead. Every color is shown as hex and OKLCH.
  reason: >-
    It must open from the file system for review. The person must see the typeface they are approving,
    or know they aren't. OKLCH makes the commitment level visible.
  layer: sistema-default
  severity: advisory
  applies_to: sistema-review/style-preview.html
  sources: [guide.visual-language.style-tile-format#3-technical-requirements]

- id: visual-language.design-md.roles-not-values
  statement: >-
    DESIGN.md body sections name token roles and explain their use. Values appear only in the front matter,
    which is generated from tokens/src/, and in the Overview's direction values.
  reason: Values written by hand in two places drift. Role names stay true when values change.
  layer: sistema-default
  severity: advisory
  applies_to: DESIGN.md

- id: visual-language.direction.changes-propagate
  statement: >-
    If the approved direction changes after foundations have been built, the affected foundations are
    rebuilt from the revised direction and approved again.
  reason: The direction is the contract between the brief and the tokens. Tokens built from an old direction quietly contradict the new one.
  layer: sistema-default
  severity: advisory
  applies_to: tokens/src/*.json after a change to DESIGN.md overview sections or the approved preview
  sources: [guide.visual-language.style-tile-format#4-what-the-review-means]
