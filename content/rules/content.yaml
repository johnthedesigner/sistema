- id: content.voice.baseline
  statement: >-
    Interface copy follows Sistema's voice baseline (plainspoken and genuine, after Mailchimp's voice traits; helpful; direct; sentence case;
    verb-plus-noun buttons) unless VOICE_AND_TONE.md records a product-specific exception and its reason.
  reason: The baseline reflects what readers of interface copy need everywhere. Exceptions should be decisions, not drift.
  layer: sistema-default
  severity: advisory
  applies_to: VOICE_AND_TONE.md, interface copy
  sources: [guide.content.voice-and-tone#2-sistemas-voice-baseline]

- id: content.errors.no-exclamation
  statement: Errors, warnings, and failure messages never use exclamation points.
  reason: An exclamation point reads as alarm or cheer, and neither helps someone fix a problem.
  layer: sistema-default
  severity: advisory
  applies_to: interface copy for errors, warnings, and failures
  sources: [guide.content.writing-mechanics#exclamation-marks]
