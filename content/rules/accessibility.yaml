- id: accessibility.target-size
  statement: >-
    Every pointer target is at least the minimum size for the project's standard, measured as the
    clickable area, not the visible shape. Where the chosen standard sets no minimum, use the WCAG 2.2 AA
    value. Larger targets for touch-first products are guidance, covered in the accessibility guide.
  reason: Small targets cause missed taps and errors, especially for people with limited dexterity.
  layer: standard
  severity: blocking
  measure: { kind: min, unit: css-px }
  parameters:
    wcag-2.2: { AA: 24, AAA: 44 }
    wcag-2.1: { AAA: 44 }
  applies_to: interactive components
  checked_by: [play.components.implement evidence, play.accessibility.audit evidence]
  sources: [guide.accessibility.floor#4-touch-and-pointer-targets]

- id: accessibility.focus-visible
  statement: >-
    Every focusable element shows a focus indicator on keyboard focus that meets color.contrast.ui against
    the surface next to it, and is never fully hidden by other content. Verify that the indicator actually renders:
    in Tailwind 4, `outline-none` with `outline-2` draws nothing unless `outline-solid` is added, and
    automated scanners don't catch it.
  reason: Keyboard users can't act on what they can't find. A ring with no line style passes code review and fails people.
  layer: standard
  severity: blocking
  measure: { kind: presence }
  applies_to: interactive components
  checked_by: [play.components.implement evidence, play.accessibility.audit evidence]
  sources: [guide.accessibility.floor#3-focus-visibility]

- id: accessibility.keyboard
  statement: >-
    Every interactive element is reachable and operable by keyboard, in visual order, with the keys its
    pattern expects (Enter and Space to activate, arrows within composite widgets, Esc to dismiss), and
    focus is never trapped except inside a modal dialog. Focus returns to the trigger when an overlay closes.
  reason: Keyboard access is the base that screen readers, switch devices, and power users all rely on.
  layer: standard
  severity: blocking
  measure: { kind: presence }
  applies_to: interactive components
  checked_by: [play.components.implement evidence, play.accessibility.audit evidence]
  sources: [guide.accessibility.floor#2-keyboard-navigation]

- id: accessibility.name-and-state
  statement: >-
    Native HTML elements come first. Every interactive element has an accessible name, and every
    dynamic state (expanded, selected, checked, busy, invalid) is exposed through the element or ARIA.
  reason: Assistive technology can only announce what the markup exposes.
  layer: standard
  severity: blocking
  measure: { kind: presence }
  applies_to: interactive components
  checked_by: [play.components.implement evidence, play.accessibility.audit evidence]
  sources: [guide.accessibility.floor#5-semantic-structure-and-aria]

- id: accessibility.reduced-motion
  statement: Animation and transitions respect `prefers-reduced-motion`. Nothing essential depends on motion.
  reason: Motion can cause nausea and distraction, and some people turn it off for that reason.
  layer: standard
  severity: blocking
  measure: { kind: presence }
  applies_to: components and pages with motion
  checked_by: [play.accessibility.audit evidence]
  sources: [guide.accessibility.floor#6-motion]

- id: accessibility.focus-not-lost
  statement: >-
    Focus is never dropped to the page body by the interface itself. In particular, don't disable the
    focused control while its action runs; ignore repeat presses instead.
  reason: When focus jumps to the top of the page, keyboard and screen reader users lose their place.
  layer: sistema-default
  severity: advisory
  applies_to: interactive components
