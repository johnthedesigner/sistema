<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visual direction</title>
<!--
  Sistema's style preview template (visual-language.direction).
  Copy this file to sistema-review/style-preview.html and replace only the JSON in
  <script id="sistema-data">. The page draws every rendering from the specimen tool,
  and the ramps and contrast from the palette and contrast tools, for the options
  the person picks. The template is served at /templates/style-preview.html on the Sistema site.
-->
<style>
:root{--bg:#f6f6f4;--panel:#fff;--hover:#efeeea;--fg:#1c1b1a;--mut:#5d5a56;--faint:#77736e;--line:#e3e0da;--acc:#1163d8;--accs:#e4eefd;--onacc:#fff;--r:10px;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#151413;--panel:#1e1d1b;--hover:#292826;--fg:#f1efeb;--mut:#aaa59e;--faint:#8c877f;--line:#35322e;--acc:#6ca6ff;--accs:#17253b;--onacc:#0a1424;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--acc)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{background:var(--panel);box-shadow:inset 0 -1px 0 var(--line)}
.top .in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.top b{font-weight:600}.top span{color:var(--faint);font-size:14px}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 24px;padding:0;list-style:none}
.steps button{border:0;background:transparent;padding:6px 10px;border-radius:99px;font-size:13.5px;color:var(--mut);cursor:pointer}
.steps button[aria-current=step]{background:var(--accs);color:var(--fg);font-weight:500}
.steps button .done{color:var(--acc);margin-left:4px}
h1{font-size:32px;line-height:1.15;margin:0 0 10px;font-weight:650;letter-spacing:-.01em}
h2{font-size:24px;line-height:1.2;margin:0 0 6px;font-weight:650}
h3{font-size:17px;margin:28px 0 8px}
.lead{font-size:18px;color:var(--mut);max-width:62ch;margin:0 0 20px}
.mut{color:var(--mut)}.small{font-size:13.5px}
.card{background:var(--panel);border-radius:var(--r);padding:18px 20px}
ul{margin:0;padding-left:20px}li{margin:4px 0}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:500}
.btn.primary{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:28px;flex-wrap:wrap}
.flip{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 10px}
.flip button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left;min-width:150px}
.flip button[aria-pressed=true]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.flip .tag{display:block;font-size:12px;color:var(--faint)}.flip .tag.c{color:var(--acc)}
.stage{background:var(--panel);border-radius:var(--r);padding:10px}
.frame{position:relative;overflow:hidden;border-radius:6px;background:var(--bg)}
.frame iframe{position:absolute;left:0;top:0;width:1280px;border:0;transform-origin:0 0}
.optinfo{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:12px}
.why{background:var(--accs);border-radius:8px;padding:10px 14px;margin-top:16px;font-size:15px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.ramp{margin:0 0 12px}.strip{display:flex;height:32px;border-radius:6px;overflow:hidden}.strip span{flex:1}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);padding:10px;font:15px/1.5 system-ui,sans-serif}
pre.answers{background:var(--panel);border-radius:8px;padding:14px;white-space:pre-wrap;font:14px/1.6 ui-monospace,Menlo,monospace;margin:0}
.status{min-height:1.4em;color:var(--mut);font-size:14px;margin-top:6px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}h1{font-size:26px}.flip button{min-width:0;flex:1}}
@media (prefers-reduced-motion:no-preference){.flip button,.btn{transition:background .15s,border-color .15s}}
</style>
</head>

<header class="top"><div class="in"><b id="t-project"></b><span id="t-progress"></span></div></header>
<main class="wrap">
  <ol class="steps" id="steps" aria-label="Sections"></ol>
  <div id="view" tabindex="-1"></div>
  <p class="small mut" id="t-continue" style="margin-top:48px"></p>
</main>
<script>
(function () {
  var D = JSON.parse(document.getElementById('sistema-data').textContent)
  var Q = D.questions
  var answers = {}
  Q.forEach(function (q) { answers[q.id] = q.proposed })
  var viewing = {}
  var visited = {}
  var screens = ['intro'].concat(Q.map(function (q) { return q.id }), ['together', 'send'])
  var current = 'intro'
  var esc = function (s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;') }
  var opt = function (q, v) { return q.options.filter(function (o) { return JSON.stringify(o.value) === JSON.stringify(v) })[0] }

  document.getElementById('t-project').textContent = D.project + ': visual direction'
  document.getElementById('t-progress').textContent = D.progress
  document.title = D.project + ' · Visual direction'
  if (D.continue) document.getElementById('t-continue').textContent = 'This project follows Sistema. To continue, fetch the URL in sistema.json "continue": ' + D.continue

  function params(over) {
    var p = Object.assign({}, D.specimen.base)
    Q.forEach(function (q) {
      var v = answers[q.id]
      if (Array.isArray(q.param)) q.param.forEach(function (k) { p[k] = v[k] })
      else p[q.param] = v
    })
    return Object.assign(p, over || {})
  }
  function renderUrl(p) {
    var u = new URLSearchParams()
    Object.keys(p).forEach(function (k) { u.set(k, String(p[k])) })
    u.set('layout', D.specimen.layout)
    if (D.specimen.content) u.set('content', JSON.stringify(D.specimen.content))
    u.set('format', 'html')
    return D.sistema + '/api/specimen?' + u
  }
  function frame(src, label) {
    return '<div class="frame" data-frame><iframe title="' + esc(label) + '" src="' + esc(src) + '"></iframe></div>'
  }
  function fit() {
    document.querySelectorAll('[data-frame]').forEach(function (f) {
      if (!f.clientWidth) return
      var s = f.clientWidth / 1280
      var ifr = f.querySelector('iframe')
      var h = f.dataset.h ? +f.dataset.h : 640
      ifr.style.height = h + 'px'
      ifr.style.transform = 'scale(' + s + ')'
      f.style.height = Math.round(h * s) + 'px'
    })
  }
  window.addEventListener('resize', fit)

  function steps() {
    document.getElementById('steps').innerHTML = screens.map(function (s, i) {
      var label = s === 'intro' ? 'Start here' : s === 'together' ? 'All together' : s === 'send' ? 'Send your answers' : (Q.findIndex(function (q) { return q.id === s }) + 1) + '. ' + Q.filter(function (q) { return q.id === s })[0].short
      var done = visited[s] && s !== 'intro' && s !== 'send' ? '<span class="done" aria-label="visited">✓</span>' : ''
      return '<li><button type="button" data-go="' + s + '"' + (s === current ? ' aria-current="step"' : '') + '>' + esc(label) + done + '</button></li>'
    }).join('')
  }
  function navButtons() {
    var i = screens.indexOf(current)
    var prev = i > 0 ? '<button class="btn" type="button" data-go="' + screens[i - 1] + '">Back</button>' : '<span></span>'
    var next = i < screens.length - 1 ? '<button class="btn primary" type="button" data-go="' + screens[i + 1] + '">' + (current === 'intro' ? 'Start with question 1' : 'Next') + '</button>' : ''
    return '<div class="nav">' + prev + next + '</div>'
  }

  function intro() {
    return '<h1>Choose the look for ' + esc(D.project) + '</h1>' +
      '<p class="lead">' + esc(D.summary) + '</p>' +
      '<div class="card"><b>What the product needs</b><ul>' + D.needs.map(function (n) { return '<li>' + esc(n) + '</li>' }).join('') + '</ul></div>' +
      '<h3>How this works</h3><ol class="mut"><li>Go through ' + Q.length + ' questions. Each shows the options drawn on ' + esc(D.project) + '’s own screen; flip between them and choose one. The proposal is chosen to start with.</li><li>See all your choices together, in light and dark.</li><li>Copy your answers and paste them back to your agent.</li></ol>' +
      (D.not && D.not.length ? '<h3>It won’t look like</h3><ul class="mut">' + D.not.map(function (n) { return '<li>' + esc(n) + '</li>' }).join('') + '</ul>' : '') +
      navButtons()
  }

  function question(q) {
    var v = viewing[q.id] !== undefined ? viewing[q.id] : answers[q.id]
    viewing[q.id] = v
    var o = opt(q, v)
    var idx = q.options.indexOf(o)
    var tabs = q.options.map(function (x, i) {
      var chosen = JSON.stringify(x.value) === JSON.stringify(answers[q.id])
      var proposed = JSON.stringify(x.value) === JSON.stringify(q.proposed)
      var tag = chosen ? '<span class="tag c">Your choice</span>' : proposed ? '<span class="tag">Proposed</span>' : '<span class="tag">&nbsp;</span>'
      return '<button type="button" data-view="' + i + '" aria-pressed="' + (i === idx) + '"><b>' + String.fromCharCode(65 + i) + '. ' + esc(x.label) + '</b>' + tag + '</button>'
    }).join('')
    // Every option is loaded at once and only the viewed one shown, so flipping is instant.
    var frames = q.options.map(function (x, i) {
      return '<div data-opt="' + i + '"' + (i === idx ? '' : ' hidden') + '>' + frame(optUrl(q, x.value), q.title + ': ' + x.label) + '</div>'
    }).join('')
    return '<p class="small mut" style="margin:0 0 4px">Question ' + (Q.indexOf(q) + 1) + ' of ' + Q.length + '</p>' +
      '<h2>' + esc(q.title) + '</h2><p class="mut" style="margin:0;max-width:66ch">' + esc(q.help) + '</p>' +
      '<div class="flip" role="group" aria-label="Options (use the arrow keys to flip)">' + tabs + '</div>' +
      '<div class="stage">' + frames + '<div class="optinfo" id="optinfo">' + optInfo(q, idx) + '</div></div>' +
      '<p class="why"><b>Proposed: ' + esc(opt(q, q.proposed).label) + '.</b> ' + esc(q.why) + '</p>' + navButtons()
  }

  function optUrl(q, v) {
    var over = {}
    if (Array.isArray(q.param)) q.param.forEach(function (k) { over[k] = v[k] })
    else over[q.param] = v
    return renderUrl(params(over))
  }
  function optInfo(q, idx) {
    var o = q.options[idx]
    var isChosen = JSON.stringify(o.value) === JSON.stringify(answers[q.id])
    return '<div><b>' + String.fromCharCode(65 + idx) + '. ' + esc(o.label) + '</b><div class="mut small">' + esc(o.desc) + '</div></div>' +
      '<div>' + (isChosen ? '<span class="mut small">✓ Your choice</span>' : '<button class="btn primary" type="button" data-choose="' + idx + '">Choose ' + String.fromCharCode(65 + idx) + '</button>') +
      ' <a class="small" target="_blank" rel="noopener" href="' + esc(optUrl(q, o.value)) + '">Open full size</a></div>'
  }
  function flipTo(q, i) {
    viewing[q.id] = q.options[i].value
    document.querySelectorAll('[data-view]').forEach(function (b) { b.setAttribute('aria-pressed', String(+b.dataset.view === i)) })
    document.querySelectorAll('[data-opt]').forEach(function (f) { f.hidden = +f.dataset.opt !== i })
    document.getElementById('optinfo').innerHTML = optInfo(q, i)
    fit()
  }

  function together() {
    var themes = D.themes || ['light']
    var frames = themes.map(function (t) { return '<div><p class="small mut" style="margin:0 0 6px">' + (t === 'dark' ? 'Dark' : 'Light') + '</p>' + frame(renderUrl(params({ theme: t })), 'All together, ' + t) + '</div>' }).join('')
    var chosen = Q.map(function (q) { var c = JSON.stringify(answers[q.id]) === JSON.stringify(q.proposed); return '<tr><td>' + esc(q.title) + '</td><td><b>' + esc(opt(q, answers[q.id]).label) + '</b>' + (c ? '' : ' <span class="mut small">(proposed: ' + esc(opt(q, q.proposed).label) + ')</span>') + '</td></tr>' }).join('')
    var stands = (D.stands || []).map(function (s) { return '<tr><td>' + esc(s.screen) + '</td><td>' + esc(s.featured) + '</td><td>' + esc(s.quiet) + '</td><td>' + esc(s.block) + '</td></tr>' }).join('')
    return '<h2>All together</h2><p class="mut">Your choices at once. The content is arranged by role; real hierarchy is settled once there are real screens.</p>' +
      '<div class="grid2">' + frames + '</div>' +
      '<h3>Your choices</h3><table>' + chosen + '</table>' +
      '<h3>Color</h3><div id="ramps" class="mut small">Loading ramps from the palette tool…</div>' +
      '<details style="margin-top:10px"><summary class="small">Roles and contrast</summary><div id="roles" class="small mut">Loading…</div></details>' +
      '<h3>Type</h3><div id="type"></div>' +
      (stands ? '<h3>What stands out on each screen</h3><p class="small mut">A first guess, revised when real screens exist.</p><table><tr><th>Screen</th><th>Featured</th><th>Quiet</th><th>Brand or inverse block</th></tr>' + stands + '</table>' : '') +
      ((D.notes || []).length ? '<h3>Notes</h3><ul class="mut">' + D.notes.map(function (n) { return '<li>' + esc(n) + '</li>' }).join('') + '</ul>' : '') + navButtons()
  }

  function send() {
    return '<h2>Send your answers</h2><p class="mut">Copy this and paste it to your agent. Add anything else you want changed first.</p>' +
      '<pre class="answers" id="ans"></pre>' +
      '<label for="note" class="small mut" style="display:block;margin:14px 0 6px">Anything else to change (optional)</label><textarea id="note"></textarea>' +
      '<div class="nav"><button class="btn" type="button" data-go="together">Back</button><button class="btn primary" type="button" id="copy">Copy answers</button></div><div class="status" role="status" id="st"></div>'
  }
  function answerText() {
    var lines = Q.map(function (q, i) { var o = opt(q, answers[q.id]); var p = JSON.stringify(answers[q.id]) === JSON.stringify(q.proposed); return (i + 1) + '. ' + q.title + ' ' + o.label + (p ? ' (as proposed)' : '') })
    var n = document.getElementById('note')
    var extra = n && n.value.trim() ? '\nAlso: ' + n.value.trim() : ''
    return 'Direction answers for ' + D.project + ':\n' + lines.join('\n') + extra
  }

  function loadColor() {
    var p = params({ theme: 'light' })
    var post = function (path, body) { return fetch(D.sistema + path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }).then(function (r) { return r.json() }) }
    Promise.all([post('/api/specimen', Object.assign({}, p, { layout: D.specimen.layout })), post('/api/specimen', Object.assign({}, p, { theme: 'dark', layout: D.specimen.layout }))]).then(function (res) {
      var L = res[0], Dk = res[1]
      post('/api/palette', { colors: { accent: L.seeds.accent, neutral: L.seeds.neutral } }).then(function (pal) {
        var el = document.getElementById('ramps'); if (!el) return
        el.innerHTML = Object.keys(pal.palettes).map(function (k) {
          var r = pal.palettes[k]
          return '<div class="ramp"><div class="small mut">' + (k === 'accent' ? 'Accent' : 'Grays') + ' · seed ' + esc(r.seed) + '</div><div class="strip">' + Object.keys(r.stops).map(function (s) { var x = r.stops[s]; return '<span style="background:' + x.hex + '" title="' + s + ' ' + x.hex + ' ' + x.oklch + '"></span>' }).join('') + '</div></div>'
        }).join('')
      })
      var c = function (s, k) { return s.colors[k] && s.colors[k].hex }
      var pairs = []
      ;[['light', L], ['dark', Dk]].forEach(function (t) {
        var s = t[1]
        ;[['Text on page', 'text', 'canvas'], ['Text on panel', 'text', 'surface'], ['Secondary text on panel', 'text-secondary', 'surface'], ['Link on page', 'link', 'canvas'], ['Button label', 'on-primary', 'primary'], ['Text on selected', 'text', 'selected-row'], ['Text on brand block', 'on-brand', 'surface-brand'], ['Text on inverse', 'on-inverse', 'surface-inverse']].forEach(function (x) { pairs.push({ label: x[0] + ' (' + t[0] + ')', foreground: c(s, x[1]), background: c(s, x[2]), purpose: 'text' }) })
        pairs.push({ label: 'Focus ring on page (' + t[0] + ')', foreground: c(s, 'focus'), background: c(s, 'canvas'), purpose: 'ui' })
      })
      post('/api/contrast', { standard: D.standard || 'wcag-2.2 AA', pairs: pairs }).then(function (con) {
        var el = document.getElementById('roles'); if (!el) return
        var roles = Object.keys(L.token_roles).map(function (k) { var a = L.token_roles[k], b = Dk.token_roles[k] || {}; return '<tr><td><code>' + k + '</code></td><td><span class="sw" style="background:' + a.hex + '"></span>' + a.hex + ' · ' + esc(a.from) + '</td><td><span class="sw" style="background:' + b.hex + '"></span>' + (b.hex || '') + ' · ' + esc(b.from || '') + '</td></tr>' }).join('')
        var rows = con.results.map(function (r) { var ck = Object.values(r.checks)[0]; return '<tr><td>' + esc(r.label) + '</td><td>' + r.ratio + ':1</td><td>' + (ck ? (ck.pass ? 'Passes' : '<b>Fails</b>') : '') + '</td></tr>' }).join('')
        el.innerHTML = '<table><tr><th>Role</th><th>Light</th><th>Dark</th></tr>' + roles + '</table><h3>Contrast (' + esc(con.standard + ' ' + con.level) + ')</h3><table>' + rows + '</table>'
      })
    }).catch(function () { var el = document.getElementById('ramps'); if (el) el.textContent = 'The tools could not be reached. Check your connection.' })
    var f = params({})
    var fonts = [f.font, f.display_font].filter(Boolean).filter(function (x, i, a) { return a.indexOf(x) === i })
    if (fonts.length) {
      var l = document.createElement('link'); l.rel = 'stylesheet'
      l.href = 'https://fonts.googleapis.com/css2?' + fonts.map(function (x) { return 'family=' + encodeURIComponent(x).replace(/%20/g, '+') + ':wght@400;500;600' }).join('&') + '&display=swap'
      document.head.appendChild(l)
    }
    var t = document.getElementById('type')
    if (t) t.innerHTML = '<div class="card"><p style="font-family:\'' + esc(f.display_font || f.font) + '\';font-size:36px;line-height:1.1;margin:0 0 10px;font-weight:600">' + esc(D.project) + ', set in your choice</p><p style="font-family:\'' + esc(f.font) + '\';font-size:17px;max-width:62ch;margin:0">The quick brown fox jumps over the lazy dog. Figures: 0123456789, IDs like JOB-20417, and times like 10:40 am.</p><p class="small mut" style="margin:10px 0 0">Headings: ' + esc(f.display_font || f.font) + '. Text: ' + esc(f.font) + '.' + (D.fontNote ? ' ' + esc(D.fontNote) : '') + '</p></div>'
  }

  function show(s, focus) {
    current = s
    visited[s] = true
    var v = document.getElementById('view')
    var q = Q.filter(function (x) { return x.id === s })[0]
    v.innerHTML = s === 'intro' ? intro() : s === 'together' ? together() : s === 'send' ? send() : question(q)
    steps()
    fit()
    if (s === 'together') loadColor()
    if (s === 'send') { document.getElementById('ans').textContent = answerText(); document.getElementById('note').addEventListener('input', function () { document.getElementById('ans').textContent = answerText() }) }
    if (focus) v.focus()
  }

  document.addEventListener('click', function (e) {
    var g = e.target.closest('[data-go]')
    if (g) { show(g.dataset.go, true); window.scrollTo(0, 0); return }
    var vw = e.target.closest('[data-view]')
    if (vw) { flipTo(Q.filter(function (x) { return x.id === current })[0], +vw.dataset.view); return }
    var ch = e.target.closest('[data-choose]')
    if (ch) {
      var q2 = Q.filter(function (x) { return x.id === current })[0], i2 = +ch.dataset.choose
      answers[q2.id] = q2.options[i2].value
      document.querySelectorAll('[data-view]').forEach(function (b) {
        var j = +b.dataset.view, x = q2.options[j]
        var tag = j === i2 ? '<span class="tag c">Your choice</span>' : JSON.stringify(x.value) === JSON.stringify(q2.proposed) ? '<span class="tag">Proposed</span>' : '<span class="tag">&nbsp;</span>'
        b.innerHTML = '<b>' + String.fromCharCode(65 + j) + '. ' + esc(x.label) + '</b>' + tag
      })
      document.getElementById('optinfo').innerHTML = optInfo(q2, i2)
      return
    }
    if (e.target.id === 'copy') {
      var text = answerText(), st = document.getElementById('st')
      var done = function (ok) { st.textContent = ok ? 'Copied. Paste it to your agent.' : 'Copy failed. Select the text above and copy it.' }
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(function () { done(true) }, function () { done(fallback(text)) })
      else done(fallback(text))
    }
  })
  function fallback(text) { var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); var ok = false; try { ok = document.execCommand('copy') } catch (e) {} t.remove(); return ok }
  document.addEventListener('keydown', function (e) {
    var b = e.target.closest && e.target.closest('[data-view]')
    if (!b || (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft')) return
    var q = Q.filter(function (x) { return x.id === current })[0]
    var i = (+b.dataset.view + (e.key === 'ArrowRight' ? 1 : -1) + q.options.length) % q.options.length
    flipTo(q, i); document.querySelector('[data-view="' + i + '"]').focus(); e.preventDefault()
  })
  show('intro')
})()
</script>
