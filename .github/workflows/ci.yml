name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Content-level rules are report-only until V1; this prints them.
      - name: Content check report
        run: npm run check:content

      # prebuild and postbuild run the code-level checks in strict mode.
      - name: Build
        run: npm run build
