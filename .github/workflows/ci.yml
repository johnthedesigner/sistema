name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Report-only until V0.6 makes code-level rules blocking.
      - name: Content check (source)
        run: npm run check:content

      - name: Build
        run: npm run build

      - name: Content check (built output)
        run: npm run check:content -- --output-only
